# Credenciales del destino OFF-SITE (DR) — p. ej. AWS S3. NO commitear el real.
#   kubectl create secret generic offsite-backup -n data \
#     --from-literal=DEST_ENDPOINT='https://s3.us-east-1.amazonaws.com' \
#     --from-literal=DEST_BUCKET='homelab-pg-dr' \
#     --from-literal=DEST_ACCESS_KEY='<AK>' \
#     --from-literal=DEST_SECRET_KEY='<SK>'
apiVersion: v1
kind: Secret
metadata:
  name: offsite-backup
  namespace: data
type: Opaque
stringData:
  DEST_ENDPOINT: "https://s3.us-east-1.amazonaws.com"
  DEST_BUCKET: "homelab-pg-dr"
  DEST_ACCESS_KEY: "REEMPLAZAR"
  DEST_SECRET_KEY: "REEMPLAZAR"
