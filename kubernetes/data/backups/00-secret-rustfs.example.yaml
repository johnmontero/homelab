# Secret con las credenciales de RustFS (S3) para los backups de CNPG.
# NO commitear el secret real. Créalo a partir del secret existente `rustfs-creds`
# del namespace `storage` (ver docs/05-postgres-cnpg.md), por ejemplo:
#
#   AK=$(kubectl get secret rustfs-creds -n storage -o jsonpath='{.data.RUSTFS_ACCESS_KEY}' | base64 -d)
#   SK=$(kubectl get secret rustfs-creds -n storage -o jsonpath='{.data.RUSTFS_SECRET_KEY}' | base64 -d)
#   kubectl create secret generic rustfs-backup -n data \
#     --from-literal=ACCESS_KEY_ID="$AK" \
#     --from-literal=ACCESS_SECRET_KEY="$SK"
#
# Este archivo es solo una plantilla de referencia (valores de ejemplo).
apiVersion: v1
kind: Secret
metadata:
  name: rustfs-backup
  namespace: data
type: Opaque
stringData:
  ACCESS_KEY_ID: "REEMPLAZAR"
  ACCESS_SECRET_KEY: "REEMPLAZAR"
