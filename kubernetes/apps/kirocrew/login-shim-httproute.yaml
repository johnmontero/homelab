# Expone el login-shim en su PROPIO hostname login.crew.home.lab (subdominio de crew,
# para no pisar rutas del SPA de Crew). DNS en AdGuard: un wildcard cubre la familia:
#   *.crew.home.lab → 192.168.18.220   (cubre login.crew.home.lab y futuros subservicios)
#   crew.home.lab   → 192.168.18.220   (apex = dashboard; el wildcard no cubre el apex)
#
# Flujo: abres http://login.crew.home.lab → (login) → el shim mintea un token y hace
# 303 a http://crew.home.lab/?token=... → Crew canjea la cookie y entra.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kirocrew-login-route
  namespace: kirocrew
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: http
  hostnames:
    - login.crew.home.lab
  rules:
    - backendRefs:
        - name: kirocrew-login
          port: 8088
