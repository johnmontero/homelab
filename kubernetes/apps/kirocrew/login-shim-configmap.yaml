# Script del "login-shim": un servidor mínimo (stdlib, sin dependencias) que corre
# como sidecar en el pod de Kiro Crew. Sirve una página de login con la identidad de
# Kiro Crew (tema oscuro, acento violeta, fuente Space Grotesk) y:
#   - si el navegador ya trae la cookie de sesión de Crew -> 303 a la interfaz;
#   - al enviar el formulario con credenciales válidas, MINTEA un token pidiéndoselo
#     al gateway por loopback (127.0.0.1:5476/api/token/local con el secreto local del
#     PVC) y hace 303 a http://crew.home.lab/?token=<token>, que canjea la cookie.
#
# Como MINTEAR un token equivale a saltarse la barrera de auth de Crew, el shim exige
# su PROPIA credencial (formulario user/contraseña) salvo modo abierto explícito.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kirocrew-login-shim
  namespace: kirocrew
  labels:
    app: kirocrew
data:
  login_shim.py: |
    #!/usr/bin/env python3
    """Auto-login shim para el dashboard de Kiro Crew (ver ConfigMap)."""
    from __future__ import annotations
    import base64
    import hashlib
    import hmac
    import html
    import json
    import os
    import re
    import select
    import ssl
    import subprocess
    import sys
    import threading
    import time
    import urllib.parse
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    PORT = int(os.environ.get("LOGIN_SHIM_PORT", "8088"))
    CREW_PORT = int(os.environ.get("CREW_PORT", "5476"))
    PUBLIC_URL = os.environ.get("CREW_PUBLIC_URL", "http://crew.home.lab").rstrip("/")
    COOKIE_NAME = os.environ.get("CREW_SESSION_COOKIE", "mc_token_5476")
    TTL = os.environ.get("LOGIN_SHIM_TTL", "20h")
    HOME = os.environ.get("KIROCREW_HOME", "/home/kirocrew")
    LOGIN_USER = os.environ.get("LOGIN_SHIM_USER", "crew")
    LOGIN_PASS = os.environ.get("LOGIN_SHIM_PASSWORD", "")
    ALLOW_OPEN = os.environ.get("LOGIN_SHIM_ALLOW_OPEN", "").lower() in ("1", "true", "yes")
    LOGO_URL = os.environ.get("LOGIN_SHIM_LOGO_URL", PUBLIC_URL + "/logo.png")
    LOGO_PATH = os.environ.get("LOGIN_SHIM_LOGO_PATH", "/icon-192.png")
    # Logo servido inline (data URI) para que aparezca aun cuando Crew esta caido
    # (p. ej. durante el reinicio). Un hilo lo baja por loopback y lo cachea; hasta
    # entonces cae al URL externo.
    LOGO = {"uri": LOGO_URL}
    KIROCLI = os.environ.get("KIROCLI_BIN", "kiro-cli")
    CREW_DEPLOYMENT = os.environ.get("CREW_DEPLOYMENT", "kirocrew")
    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    SESS_COOKIE = "shim_sess"
    SESS_TTL = int(os.environ.get("LOGIN_SHIM_SESSION_TTL", "43200"))  # 12h

    TOKEN_RE = re.compile(r"[?&]token=([^\s&]+)")
    # Parser genérico del device flow: cualquier URL https y un código tipo XXXX-XXXX.
    URL_RE = re.compile(r"https?://[^\s'\"]+")
    CODE_RE = re.compile(r"\b[A-Z0-9]{4}-[A-Z0-9]{4}\b")
    ANSI_RE = re.compile(r"\x1b\[[0-9;?]*[a-zA-Z]")
    IDP_RE = re.compile(r"^https://[A-Za-z0-9.-]+(/[^\s]*)?$")
    REGION_RE = re.compile(r"^[a-z0-9-]{3,40}$")

    # Estado del login de cuenta en curso (device flow). Un login a la vez.
    ACCT_LOCK = threading.Lock()
    ACCT = {"active": False, "state": "idle", "url": "", "code": "", "message": "", "identity": ""}
    # Control del subproceso (fuera de ACCT: no es serializable a JSON).
    CTRL = {"proc": None, "cancel": False}

    # --- estilo Kiro Crew (tema oscuro, acento violeta, Space Grotesk) -------------
    SHELL = """<!doctype html>
    <html lang="es" data-theme="dark">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d0f12">
    <title>Kiro Crew — Acceso</title>
    <script>try{var t=localStorage.getItem("crew-login-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
    <link rel="icon" href="__LOGO__" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root{
        --bg:#0d0f12; --card:#16181d; --card2:#1a1d25; --border:#262a35; --field:#0f1116;
        --text:#f4f4f5; --muted:#9aa0a6; --accent:#a855f7; --accent2:#7e22ce; --accent-l:#c084fc;
        --glow:rgba(168,85,247,.18); --shadow:0 20px 60px rgba(0,0,0,.5);
      }
      html[data-theme="light"]{
        --bg:#eef0f4; --card:#ffffff; --card2:#ffffff; --border:#e5e7eb; --field:#f6f7f9;
        --text:#1a1d25; --muted:#6b7280; --accent:#a855f7; --accent2:#7e22ce; --accent-l:#7e22ce;
        --glow:rgba(168,85,247,.10); --shadow:0 12px 34px rgba(17,24,39,.12);
      }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0; background:var(--bg); color:var(--text);
        font-family:"Space Grotesk",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
        display:flex; align-items:center; justify-content:center; padding:24px;
        background-image:radial-gradient(60rem 40rem at 50% -10%, var(--glow), transparent 60%);
      }
      .card{
        position:relative;
        width:100%; max-width:520px; background:linear-gradient(180deg,var(--card2),var(--card));
        border:1px solid var(--border); border-radius:16px; padding:32px 28px;
        box-shadow:var(--shadow);
      }
      .themebtn{
        position:fixed; top:16px; right:16px; z-index:10; width:38px; height:38px; border-radius:10px;
        border:1px solid var(--border); background:var(--card); color:var(--muted); cursor:pointer;
        display:flex; align-items:center; justify-content:center; padding:0;
        transition:color .15s, border-color .15s;
      }
      .themebtn:hover{color:var(--text); border-color:var(--accent)}
      .themebtn svg{width:18px; height:18px}
      .i-sun{display:block} .i-moon{display:none}
      html[data-theme="light"] .i-sun{display:none}
      html[data-theme="light"] .i-moon{display:block}
      .head{display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; margin-bottom:16px}
      .logo{width:56px; height:56px; border-radius:14px; object-fit:cover}
      .wm{font-weight:600; letter-spacing:.14em; font-size:15px; text-transform:uppercase}
      .wm .a{color:var(--accent-l)}
      .sub{margin:0 0 22px; color:var(--muted); font-size:13px; text-align:center}
      form{display:flex; flex-direction:column; gap:14px; margin-top:0}
      label{font-size:12px; color:var(--muted); margin-bottom:-8px}
      input:not([type="radio"]){
        width:100%; background:var(--field); color:var(--text); border:1px solid var(--border);
        border-radius:10px; padding:11px 12px; font-size:14px; font-family:inherit; outline:none;
        transition:border-color .15s, box-shadow .15s;
      }
      input:not([type="radio"]):focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(168,85,247,.25)}
      .seg input[type="radio"]{width:auto; flex:0 0 auto; margin:0; accent-color:var(--accent); cursor:pointer}
      .submit{
        margin-top:6px; width:100%; border:0; cursor:pointer; color:#fff; font:inherit; font-weight:600;
        padding:12px; border-radius:10px; font-size:14px;
        background:linear-gradient(180deg,var(--accent),var(--accent2));
        transition:filter .15s, transform .02s;
      }
      a.submit{display:block; text-align:center; text-decoration:none; box-sizing:border-box}
      .submit:hover{filter:brightness(1.08)}
      .submit:active{transform:translateY(1px)}
      .submit.ghost, a.ghostlink{
        background:transparent; color:var(--muted); border:1px solid var(--border);
      }
      .submit.ghost:hover, a.ghostlink:hover{color:var(--text); border-color:var(--accent); filter:none}
      a.ghostlink{display:block; text-align:center; text-decoration:none; margin-top:10px; padding:9px; border-radius:10px; font-size:12px}
      .row{display:flex; gap:10px}
      .row>*{flex:1 1 0; min-width:0}
      .row form{margin:0}
      .row .submit, .row .ghostlink{margin-top:0}
      .err{
        background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.35); color:#ef4444;
        border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:4px;
      }
      .acct-row{font-size:12px; color:var(--muted); text-align:center; margin:0 0 6px}
      .acct-row b{color:var(--text)}
      .acct{
        font-size:12px; color:var(--text); background:var(--field); border:1px solid var(--border);
        border-radius:10px; padding:10px 12px; margin:0 0 14px; text-align:left;
        line-height:1.55; word-break:break-all;
      }
      .acct div{margin:0}
      .acct .arn{color:var(--muted); font-size:11px; margin-top:3px}
      .stat{display:flex; align-items:center; justify-content:center; gap:7px; font-size:12px; color:var(--muted); margin:0 0 8px}
      .dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto}
      .dot.on{background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.18)}
      .dot.off{background:var(--muted)}
      .seg{display:flex; flex-direction:column; gap:8px; font-size:13px; margin-bottom:4px}
      .seg label{display:flex; align-items:center; gap:8px; color:var(--text); margin:0; cursor:pointer}
      .code{
        font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
        background:var(--field); border:1px solid var(--border); border-radius:10px;
        padding:12px; text-align:center; font-size:15px; letter-spacing:.05em; word-break:break-all; margin:8px 0;
      }
      .hint{color:var(--muted); font-size:12px; text-align:center; margin:8px 0 0}
      .backdrop{
        position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.62);
        display:flex; align-items:center; justify-content:center; padding:24px;
      }
      .modal{
        width:100%; max-width:360px; text-align:center;
        background:linear-gradient(180deg,var(--card2),var(--card));
        border:1px solid var(--border); border-radius:16px; padding:26px 24px; box-shadow:var(--shadow);
      }
      .modal .msub{font-weight:600; font-size:16px; margin:0 0 6px}
      .dots{
        width:20px; height:20px; margin:10px auto 0; border:2px solid var(--border);
        border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite;
      }
      @keyframes spin{to{transform:rotate(360deg)}}
      .foot{margin-top:20px; text-align:center; color:var(--muted); font-size:11px}
      .foot a{color:var(--muted)}
    </style>
    </head>
    <body>
      <button class="themebtn" type="button" onclick="toggleTheme()" aria-label="Cambiar tema" title="Cambiar tema claro/oscuro">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
      <div class="card">
        <div class="head">
          <img class="logo" src="__LOGO__" alt="Kiro Crew" onerror="this.style.display='none'">
          <div class="wm">Kiro <span class="a">Crew</span></div>
        </div>
        __BODY__
        <div class="foot">Homelab · acceso al panel</div>
      </div>
      <script>function toggleTheme(){var el=document.documentElement;var n=el.dataset.theme==="light"?"dark":"light";el.dataset.theme=n;try{localStorage.setItem("crew-login-theme",n);}catch(e){}}</script>
    </body></html>"""

    def _read_secret() -> str:
        for path in (f"{HOME}/run/gateway-{CREW_PORT}.secret",
                     f"{HOME}/.kiro/crew/.local_secret"):
            try:
                with open(path, "r", encoding="utf-8") as fh:
                    val = fh.read().strip()
                if val:
                    return val
            except OSError:
                continue
        return ""

    def mint_token() -> str:
        secret = _read_secret()
        if not secret:
            raise RuntimeError("no pude leer el secreto local (¿PVC montado?)")
        url = f"http://127.0.0.1:{CREW_PORT}/api/token/local?ttl={TTL}"
        req = urllib.request.Request(url, headers={"X-Local-Secret": secret})
        with urllib.request.urlopen(req, timeout=6) as resp:  # noqa: S310 (loopback fijo)
            tok = json.loads(resp.read()).get("token", "")
        if not tok:
            raise RuntimeError("el gateway devolvió un token vacío")
        return tok

    def _has_session(cookie_header: str) -> bool:
        return re.search(r"(?:^|;\s*)" + re.escape(COOKIE_NAME) + r"=", cookie_header or "") is not None

    def _creds_ok(user: str, pw: str) -> bool:
        return hmac.compare_digest(user, LOGIN_USER) and bool(LOGIN_PASS) and hmac.compare_digest(pw, LOGIN_PASS)

    def render(body: str) -> bytes:
        return SHELL.replace("__LOGO__", html.escape(LOGO["uri"], quote=True)).replace("__BODY__", body).encode("utf-8")

    def _load_logo() -> None:
        # Baja el logo por loopback y lo cachea como data URI (independiente de que
        # crew.home.lab este arriba). Reintenta hasta que Crew responda.
        for _ in range(60):
            try:
                with urllib.request.urlopen(f"http://127.0.0.1:{CREW_PORT}{LOGO_PATH}", timeout=5) as r:  # noqa: S310
                    if getattr(r, "status", 200) == 200:
                        data = r.read()
                        if data:
                            LOGO["uri"] = "data:image/png;base64," + base64.b64encode(data).decode("ascii")
                            return
            except Exception:  # noqa: BLE001
                pass
            time.sleep(5)

    def login_body(error: str = "", user: str = "", next_: str = "") -> str:
        user_v = html.escape(user or LOGIN_USER, quote=True)
        err = f'<div class="err">{html.escape(error)}</div>' if error else ""
        nxt = f'<input type="hidden" name="next" value="{html.escape(next_, quote=True)}">' if next_ else ""
        sub = "Inicia sesión para gestionar la cuenta" if next_ == "account" else "Inicia sesión para acceder al panel"
        link = ('<a class="ghostlink" href="/">← Volver al acceso</a>' if next_ == "account"
                else '<a class="ghostlink" href="/account">Gestionar cuenta de Kiro</a>')
        return (
            f'<p class="sub">{sub}</p>'
            f'{err}'
            '<form method="post" action="/">'
            f'{nxt}'
            '<label for="u">Usuario</label>'
            f'<input id="u" name="user" value="{user_v}" autocomplete="username" autocapitalize="off" spellcheck="false">'
            '<label for="p">Contraseña</label>'
            '<input id="p" name="password" type="password" autocomplete="current-password" autofocus>'
            '<button class="submit" type="submit">Entrar</button>'
            '</form>'
            f'{link}'
        )

    def notice_body(msg: str) -> str:
        return f'<p class="sub">{html.escape(msg)}</p>'

    # --- sesión propia del shim (cookie firmada con el password) -------------------
    def _sess_sign(msg: str) -> str:
        return hmac.new((LOGIN_PASS or "disabled").encode(), msg.encode(), hashlib.sha256).hexdigest()

    def make_session() -> str:
        exp = str(int(time.time()) + SESS_TTL)
        return exp + "." + _sess_sign(exp)

    def valid_session(val: str) -> bool:
        try:
            exp, sig = (val or "").split(".", 1)
        except ValueError:
            return False
        if not hmac.compare_digest(sig, _sess_sign(exp)):
            return False
        try:
            return int(exp) > int(time.time())
        except ValueError:
            return False

    def _cookie(header: str, name: str) -> str:
        m = re.search(r"(?:^|;\s*)" + re.escape(name) + r"=([^;]+)", header or "")
        return m.group(1) if m else ""

    # --- gestión de cuenta (kiro-cli, device flow) --------------------------------
    def current_identity() -> str:
        # Devuelve las lineas del whoami (separadas por \n). Une una etiqueta suelta
        # que termina en ":" con su valor de la linea siguiente (ej. "Profile:" + valor).
        try:
            out = subprocess.run([KIROCLI, "user", "whoami"], capture_output=True, text=True, timeout=12)
            txt = (out.stdout or out.stderr or "").strip()
            raw = [l.strip() for l in txt.splitlines() if l.strip()]
            lines = []
            i = 0
            while i < len(raw):
                if raw[i].endswith(":") and i + 1 < len(raw):
                    lines.append(raw[i] + " " + raw[i + 1])
                    i += 2
                else:
                    lines.append(raw[i])
                    i += 1
            # Separa una URL entre parentesis a su propia linea:
            # "... Identity Center (https://x/start)" -> "... Identity Center" + "https://x/start"
            split = []
            for l in lines:
                m = re.match(r"^(.*?)\s*\((https?://[^)]+)\)\s*$", l)
                if m:
                    if m.group(1):
                        split.append(m.group(1))
                    split.append(m.group(2))
                else:
                    split.append(l)
            return "\n".join(split)[:500] or "desconocida"
        except Exception as exc:  # noqa: BLE001
            return f"no disponible ({exc})"

    def ident_html(ident: str) -> str:
        lines = [p for p in (ident or "").split("\n") if p.strip()] or [ident or "desconocida"]
        low = (ident or "").lower()
        connected = bool(ident.strip()) and "not logged in" not in low and "no disponible" not in low and "desconocida" not in low
        badge = ('<div class="stat"><span class="dot ' + ("on" if connected else "off") + '"></span>'
                 + ("Cuenta conectada" if connected else "Sin sesión") + '</div>')
        rows = []
        for p in lines:
            lp = p.lower()
            cls = ' class="arn"' if (lp.startswith("arn:") or lp.startswith("http")) else ""
            rows.append("<div" + cls + ">" + html.escape(p) + "</div>")
        return badge + '<div class="acct">' + "".join(rows) + "</div>"

    def run_login(method: str, url: str, region: str) -> None:
        # kiro-cli rechaza login si ya hay sesión: cerrar primero (cambiar = re-login).
        try:
            subprocess.run([KIROCLI, "logout"], capture_output=True, text=True, timeout=40)
        except Exception:  # noqa: BLE001
            pass
        if method == "sso":
            cmd = [KIROCLI, "login", "--license", "pro",
                   "--identity-provider", url, "--region", region, "--use-device-flow"]
        else:
            cmd = [KIROCLI, "login", "--license", "free", "--use-device-flow"]
        with ACCT_LOCK:
            ACCT.update(state="pending", message="Solicitando código…")
        # kiro-cli pro exige TTY: prompta Start URL/Región (pre-llenados desde los flags).
        # Sin TTY la región queda vacía ("invalid host label"). Corremos bajo un PTY y
        # respondemos cada prompt con Enter para aceptar los valores pre-llenados.
        master, slave = os.openpty()
        try:
            proc = subprocess.Popen(cmd, stdin=slave, stdout=slave, stderr=slave, close_fds=True)
        except Exception as exc:  # noqa: BLE001
            for fd in (master, slave):
                try:
                    os.close(fd)
                except OSError:
                    pass
            with ACCT_LOCK:
                ACCT.update(active=False, state="error", message=f"No pude ejecutar kiro-cli: {exc}")
                CTRL["proc"] = None
            return
        os.close(slave)
        with ACCT_LOCK:
            CTRL["proc"], CTRL["cancel"] = proc, False
        buf = ""
        answered = 0
        start = time.time()
        while True:
            try:
                ready, _, _ = select.select([master], [], [], 1.0)
            except Exception:  # noqa: BLE001
                break
            if ready:
                try:
                    chunk = os.read(master, 4096)
                except OSError:
                    break
                if not chunk:
                    break
                buf += chunk.decode("utf-8", "replace")
                if len(buf) > 65536:
                    buf = buf[-65536:]
                clean = ANSI_RE.sub("", buf)
                prompts = clean.count("? Enter")
                while answered < prompts and answered < 4:
                    try:
                        os.write(master, b"\n")
                    except OSError:
                        break
                    answered += 1
                mc = CODE_RE.search(clean)
                code = mc.group(0) if mc else ""
                verify = ""
                for m in URL_RE.finditer(clean):
                    u = m.group(0).rstrip(".,)")
                    # solo la URL de verificación (no el eco de la Start URL del prompt)
                    if ("user_code=" in u) or ("/device" in u) or ("device.sso" in u) or (code and code in u):
                        verify = u
                        break
                with ACCT_LOCK:
                    if code and not ACCT["code"]:
                        ACCT["code"] = code
                    if verify and not ACCT["url"]:
                        ACCT["url"] = verify
                    if ACCT["code"] or ACCT["url"]:
                        ACCT.update(state="prompt", message="Abre el enlace y confirma el código.")
            if proc.poll() is not None:
                break
            if time.time() - start > 600:
                try:
                    proc.terminate()
                except Exception:  # noqa: BLE001
                    pass
                break
        try:
            os.close(master)
        except OSError:
            pass
        proc.wait()
        with ACCT_LOCK:
            cancelled = CTRL["cancel"]
            CTRL["proc"], CTRL["cancel"] = None, False
        ident = current_identity()
        low = ident.lower()
        logged = ("not logged in" not in low) and ("no disponible" not in low) and ident != "desconocida"
        with ACCT_LOCK:
            ACCT["identity"] = ident
            if cancelled:
                ACCT.update(active=False, state="idle", url="", code="",
                            message="Cancelado. La sesión anterior se cerró; inicia sesión con una cuenta.")
            elif logged:
                ACCT.update(active=False, state="success", message="Sesión iniciada. Reinicia Crew para aplicar.")
            else:
                tail = " ".join(ANSI_RE.sub("", buf).strip().splitlines()[-3:]) if buf.strip() else ""
                ACCT.update(active=False, state="error", message=("El login falló o expiró. " + tail).strip())

    def start_login(method: str, url: str, region: str) -> bool:
        with ACCT_LOCK:
            if ACCT["active"]:
                return False
            ACCT.update(active=True, state="starting", url="", code="", message="Cerrando sesión anterior…", identity="")
        threading.Thread(target=run_login, args=(method, url, region), daemon=True).start()
        return True

    def restart_crew() -> None:
        # rollout restart del deployment kirocrew: patch de restartedAt en spec.template.
        # Usa el token del SA montado en el pod (RBAC acotado en rbac.yaml). Reinicia el
        # propio pod (incluye este sidecar), asi que la respuesta se envia antes del corte.
        with open(f"{SA_DIR}/token", encoding="utf-8") as fh:
            token = fh.read().strip()
        try:
            with open(f"{SA_DIR}/namespace", encoding="utf-8") as fh:
                ns = fh.read().strip() or "kirocrew"
        except OSError:
            ns = "kirocrew"
        host = os.environ.get("KUBERNETES_SERVICE_HOST", "kubernetes.default.svc")
        port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
        api = f"https://{host}:{port}/apis/apps/v1/namespaces/{ns}/deployments/{CREW_DEPLOYMENT}"
        stamp = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
        body = json.dumps({"spec": {"template": {"metadata": {"annotations": {
            "kubectl.kubernetes.io/restartedAt": stamp}}}}}).encode("utf-8")
        req = urllib.request.Request(api, data=body, method="PATCH", headers={
            "Authorization": f"Bearer {token}",
            "Content-Type": "application/strategic-merge-patch+json",
            "Accept": "application/json",
        })
        ctx = ssl.create_default_context(cafile=f"{SA_DIR}/ca.crt")
        with urllib.request.urlopen(req, timeout=10, context=ctx) as resp:  # noqa: S310
            if resp.status not in (200, 201):
                raise RuntimeError(f"HTTP {resp.status}")

    def account_body(error: str = "") -> str:
        with ACCT_LOCK:
            st = dict(ACCT)
        state = st.get("state", "idle")
        if st.get("active") or state in ("starting", "pending", "prompt"):
            code = html.escape(st.get("code") or "…")
            url = st.get("url") or ""
            url_js = json.dumps(url)
            msg = html.escape(st.get("message") or "Solicitando código…")
            if url:
                action = ('<button class="submit" type="button" onclick="openAuth()">Abrir verificación</button>'
                          '<p class="hint">Al aprobar en AWS, esta ventana se cierra sola.</p>')
            else:
                action = '<div class="dots"></div>'
            return (
                '<p class="sub">Autorizando cuenta…</p>'
                '<div class="backdrop"><div class="modal">'
                '<p class="msub">Autoriza el acceso</p>'
                f'<p class="hint">{msg}</p>'
                f'<div class="code">{code}</div>'
                f'{action}'
                '<form method="post" action="/account/cancel"><button class="submit ghost" type="submit">Cancelar</button></form>'
                '</div></div>'
                '<script>'
                'var AUTH_URL=' + url_js + ';var pop=null;'
                'function openAuth(){var w=520,h=760,'
                'l=Math.max(0,((screen.width||1200)-w)/2),tp=Math.max(0,((screen.height||800)-h)/2);'
                'pop=window.open(AUTH_URL,"crew-sso","width="+w+",height="+h+",left="+l+",top="+tp);'
                'if(pop){pop.focus();}}'
                'var R="' + state + '";'
                'setInterval(function(){fetch("/account/status").then(function(r){return r.json();})'
                '.then(function(s){'
                'if(s.state==="success"){try{if(pop){pop.close();}}catch(e){}location.href="/account";}'
                'else if(s.state!==R){location.reload();}'
                '});},2500);'
                '</script>'
            )
        if state == "success":
            return (
                '<p class="sub">Sesión iniciada</p>'
                f'{ident_html(st.get("identity") or "")}'
                '<p class="hint">Aplica el cambio reiniciando Crew:</p>'
                '<form method="post" action="/account/restart"><button class="submit" type="submit">Reiniciar Crew ahora</button></form>'
                '<p class="hint">o manualmente:</p>'
                '<div class="code">kubectl -n kirocrew rollout restart deploy/kirocrew</div>'
                '<div class="row">'
                '<a class="submit ghost" href="/enter">Ir al panel</a>'
                '<a class="submit ghost" href="/account">Volver a Cuenta</a>'
                '</div>'
            )
        ident_raw = current_identity()
        emsg = error or (st.get("message", "") if state == "error" else "")
        err = f'<div class="err">{html.escape(emsg)}</div>' if emsg else ""
        return (
            '<p class="sub">Gestiona la cuenta de Kiro</p>'
            f'{ident_html(ident_raw)}'
            f'{err}'
            '<form method="post" action="/account/start">'
            '<label>Método</label>'
            '<div class="seg">'
            '<label><input type="radio" name="method" value="sso" checked onclick="ssoFields(true)"> SSO / Identity Center</label>'
            '<label><input type="radio" name="method" value="builderid" onclick="ssoFields(false)"> Builder ID</label>'
            '</div>'
            '<div id="ssof">'
            '<label for="url">Start URL</label>'
            '<input id="url" name="url" placeholder="https://mi-org.awsapps.com/start" autocapitalize="off" spellcheck="false">'
            '<label for="rg">Región</label>'
            '<input id="rg" name="region" placeholder="us-east-1" autocapitalize="off" spellcheck="false">'
            '</div>'
            '<button class="submit" type="submit">Iniciar sesión con esta cuenta</button>'
            '</form>'
            '<p class="hint">Cambiar de cuenta cierra la sesión actual.</p>'
            '<div class="row">'
            '<form method="post" action="/account/logout"><button class="submit ghost" type="submit">Cerrar sesión</button></form>'
            '<a class="submit ghost" href="/">← Volver al acceso</a>'
            '</div>'
            '<script>function ssoFields(on){document.getElementById("ssof").style.display=on?"":"none";}</script>'
        )

    def landing_body() -> str:
        return (
            '<p class="sub">Ya tienes sesión en el shim</p>'
            '<a class="submit" href="/enter">Entrar al panel</a>'
            '<a class="ghostlink" href="/account">Gestionar cuenta de Kiro</a>'
        )

    def restarting_body() -> str:
        return (
            '<p class="sub">Reiniciando Crew…</p>'
            '<p class="hint" id="cdmsg">Volviendo al panel en <b id="cd">20</b> s…</p>'
            '<div class="dots" id="sp" style="display:none"></div>'
            '<a class="submit" href="/enter">Ir al panel ahora</a>'
            '<script>'
            'var n=20,cd=document.getElementById("cd"),msg=document.getElementById("cdmsg"),sp=document.getElementById("sp");'
            'function check(){fetch("/account/crew-ready",{cache:"no-store"}).then(function(r){return r.json();})'
            '.then(function(s){if(s&&s.ready){location.href="/enter";}else{setTimeout(check,2500);}})'
            '.catch(function(){setTimeout(check,2500);});}'
            'var t=setInterval(function(){n--;if(cd){cd.textContent=(n>0?n:0);}if(n<=0){clearInterval(t);'
            'if(msg){msg.textContent="Esperando a que el panel esté listo…";}if(sp){sp.style.display="block";}check();}},1000);'
            '</script>'
        )

    class Handler(BaseHTTPRequestHandler):
        server_version = "crew-login-shim/3"

        def _send(self, code: int, body: bytes, ctype="text/html; charset=utf-8", extra=None):
            self.send_response(code)
            for k, v in (extra or {}).items():
                self.send_header(k, v)
            self.send_header("Content-Type", ctype)
            self.send_header("Cache-Control", "no-store")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            if body:
                self.wfile.write(body)

        def _redirect(self, location: str, cookie: str = ""):
            self.send_response(303)
            self.send_header("Location", location)
            if cookie:
                self.send_header("Set-Cookie", cookie)
            self.send_header("Cache-Control", "no-store")
            self.send_header("Content-Length", "0")
            self.end_headers()

        def _authed(self) -> bool:
            if ALLOW_OPEN and not LOGIN_PASS:
                return True
            return valid_session(_cookie(self.headers.get("Cookie", ""), SESS_COOKIE))

        def _enter(self, cookie: str = ""):
            """Mintea el token de Crew y redirige al panel."""
            try:
                token = mint_token()
            except Exception as exc:  # noqa: BLE001
                self._send(502, render(notice_body(f"No pude iniciar sesión: {exc}")))
                return
            self._redirect(f"{PUBLIC_URL}/?token={token}", cookie)

        def _read_form(self):
            length = int(self.headers.get("Content-Length", "0") or "0")
            raw = self.rfile.read(length).decode("utf-8", "replace") if length else ""
            return urllib.parse.parse_qs(raw)

        def do_GET(self):
            path = self.path.split("?", 1)[0]
            if path.startswith("/healthz"):
                self._send(200, b"ok", "text/plain; charset=utf-8")
                return
            if path.startswith("/favicon"):
                self._send(204, b"")
                return
            if path == "/account/crew-ready":
                # Readiness real de Crew: /api/ready da 503 mientras arranca y 200 al
                # estar listo. Lo consultamos por loopback (el navegador no puede leer
                # el status cross-origin). Sin auth: solo revela si esta listo.
                ready = False
                try:
                    with urllib.request.urlopen(  # noqa: S310 (loopback fijo)
                            f"http://127.0.0.1:{CREW_PORT}/api/ready", timeout=4) as r:
                        ready = getattr(r, "status", 200) == 200
                except Exception:  # noqa: BLE001 (503/arranque/caido -> no listo)
                    ready = False
                self._send(200, json.dumps({"ready": ready}).encode("utf-8"), "application/json")
                return
            if not LOGIN_PASS and not ALLOW_OPEN:
                self._send(503, render(notice_body(
                    "Auto-login desactivado. Define LOGIN_SHIM_PASSWORD (recomendado) "
                    "o LOGIN_SHIM_ALLOW_OPEN=true.")))
                return
            if path == "/account/status":
                if not self._authed():
                    self._send(401, b'{"state":"unauth"}', "application/json")
                    return
                with ACCT_LOCK:
                    st = dict(ACCT)
                self._send(200, json.dumps(st).encode("utf-8"), "application/json")
                return
            if path == "/account":
                if not self._authed():
                    self._send(200, render(login_body(next_="account")))
                    return
                self._send(200, render(account_body()))
                return
            if path == "/enter":
                if self._authed() or (ALLOW_OPEN and not LOGIN_PASS):
                    self._enter()
                    return
                self._redirect("/")
                return
            # "/" — landing (o formulario de login si no hay sesión del shim)
            if ALLOW_OPEN and not LOGIN_PASS:
                self._enter()
                return
            if self._authed():
                self._send(200, render(landing_body()))
                return
            self._send(200, render(login_body()))

        def do_POST(self):
            if not LOGIN_PASS and not ALLOW_OPEN:
                self._send(503, render(notice_body("Auto-login desactivado.")))
                return
            path = self.path.split("?", 1)[0]
            form = self._read_form()
            if path == "/account/start":
                if not self._authed():
                    self._redirect("/account")
                    return
                method = (form.get("method", ["sso"])[0]).strip()
                url = (form.get("url", [""])[0]).strip()
                region = (form.get("region", [""])[0]).strip()
                if method == "sso" and (not IDP_RE.match(url) or not REGION_RE.match(region)):
                    self._send(400, render(account_body("Start URL o región inválidos.")))
                    return
                start_login(method, url, region)
                self._redirect("/account")
                return
            if path == "/account/cancel":
                if not self._authed():
                    self._redirect("/account")
                    return
                with ACCT_LOCK:
                    proc = CTRL["proc"]
                    if proc is not None:
                        CTRL["cancel"] = True
                if proc is not None:
                    try:
                        proc.terminate()
                    except Exception:  # noqa: BLE001
                        pass
                self._redirect("/account")
                return
            if path == "/account/logout":
                if not self._authed():
                    self._redirect("/account")
                    return
                try:
                    subprocess.run([KIROCLI, "logout"], capture_output=True, text=True, timeout=40)
                except Exception:  # noqa: BLE001
                    pass
                self._redirect("/account")
                return
            if path == "/account/restart":
                if not self._authed():
                    self._redirect("/account")
                    return
                try:
                    restart_crew()
                    self._send(200, render(restarting_body()))
                except Exception as exc:  # noqa: BLE001
                    self._send(502, render(notice_body(
                        f"No pude reiniciar Crew: {exc}. Usa: "
                        "kubectl -n kirocrew rollout restart deploy/kirocrew")))
                return
            # "/" — login de acceso
            user = (form.get("user", [""])[0]).strip()
            pw = form.get("password", [""])[0]
            nxt = (form.get("next", [""])[0]).strip()
            if ALLOW_OPEN and not LOGIN_PASS:
                self._enter()
                return
            if not _creds_ok(user, pw):
                self._send(401, render(login_body("Usuario o contraseña incorrectos.", user, nxt)))
                return
            cookie = f"{SESS_COOKIE}={make_session()}; HttpOnly; Path=/; SameSite=Lax; Max-Age={SESS_TTL}"
            if nxt == "account":
                self._redirect("/account", cookie)
                return
            self._enter(cookie)

        def log_message(self, fmt, *args):
            sys.stderr.write("login-shim %s - %s\n" % (self.address_string(), fmt % args))

    if __name__ == "__main__":
        mode = "form-auth" if LOGIN_PASS else ("ABIERTO" if ALLOW_OPEN else "desactivado")
        sys.stderr.write(f"login-shim escuchando en :{PORT} (modo={mode}, destino={PUBLIC_URL})\n")
        threading.Thread(target=_load_logo, daemon=True).start()
        ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
