# Credencial de solo-lectura para que el initContainer de Crew clone/pulle el canon
# de steering (repo privado protecso-kiro-workflow). NO subir el token real.
#
# Recomendado: PAT fine-grained read-only (contents:read) o deploy key. Como puente
# se reusó el PAT de ghcr-creds (protecso-sac). Crear/rotar así (sin exponerlo):
#
#   kubectl -n kirocrew create secret generic kirocrew-git-creds \
#     --from-literal=username='<usuario>' \
#     --from-literal=token='<PAT read-only>' \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: kirocrew-git-creds
  namespace: kirocrew
type: Opaque
stringData:
  username: "REPLACE_ME"
  token: "REPLACE_ME"   # PAT read-only o deploy token
