apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirocrew
  namespace: kirocrew
  labels:
    app: kirocrew
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: kirocrew
  strategy:
    type: Recreate          # estado en un PVC RWO: nunca dos pods a la vez
  template:
    metadata:
      labels:
        app: kirocrew
    spec:
      # k8s inyecta env vars por cada Service del ns (KIROCREW_PORT=tcp://ip:5476),
      # que colisiona con la KIROCREW_PORT (entero) que lee Crew y lo hace crashear.
      # Desactivamos esa inyección.
      enableServiceLinks: false
      # SA con permisos mínimos para el CI→rollout de PIVAS (ver rbac.yaml). El token
      # se auto-monta en /var/run/secrets/kubernetes.io/serviceaccount para que el
      # agente pueda reiniciar deploy/pivas. Quítalo si no quieres darle ese acceso.
      serviceAccountName: kirocrew-deployer
      # Cluster mixto (ZimaBoard amd64 + Jetson arm64). La imagen es multi-arch,
      # pero al usar local-path (node-local) fijamos el pod al nodo "servidor"
      # amd64 (igual que postgres-dev/pivas) para que el volumen sea estable.
      nodeSelector:
        kubernetes.io/arch: amd64
      # El agente de Kiro Crew prueba un sandbox con user namespaces (unshare/clone).
      # Bajo containerd (k3s) el perfil seccomp por defecto lo bloquea y DESHABILITA
      # la ejecución de agentes. Unconfined permite el sandbox interno. Si aun así
      # queda deshabilitado, ver README (bajar el nivel de sandbox en la config).
      securityContext:
        seccompProfile:
          type: Unconfined
      containers:
        - name: kirocrew
          image: ghcr.io/kirodotdev/kirocrew:stable
          imagePullPolicy: Always
          env:
            - name: KIROCREW_PORT     # explícito por robustez (además de enableServiceLinks:false)
              value: "5476"
            # Añade crew.home.lab a la allowlist de Host/origins del dashboard. Sin esto,
            # Crew responde "403 Host header not allowed" a cualquier acceso que no sea
            # localhost (defensa anti DNS-rebinding). Es lo que habilita el acceso por el
            # Gateway (ver httproute.yaml y README). La imagen ya trae KIROCREW_BIND=0.0.0.0.
            - name: KIROCREW_CORS_ORIGINS
              value: "http://crew.home.lab"
          ports:
            - name: http
              containerPort: 5476
          # KIROCREW_HOME por defecto es /home/kirocrew (igual que el docker run oficial).
          volumeMounts:
            - name: home
              mountPath: /home/kirocrew
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "2"
              # Crew = gateway + modelo de embeddings + sesión de agente (kiro-cli).
              # Crew mide la memoria DENTRO del cgroup (disponible = limit - uso). Con
              # 4Gi e idle ~2Gi, quedaban ~2GB y saltaba el watchdog (critical 2GB) y
              # nunca alcanzaba spawn_min_memory_gb=4 (subagentes bloqueados). El nodo
              # tiene 16Gi (~9 libres), así que damos headroom real con 8Gi.
              memory: 8Gi
          # Sin probes HTTP: por defecto el dashboard escucha en loopback, así que
          # kubelet no lo alcanza por podIP. El acceso se hace por `kubectl port-forward`
          # (usa la loopback del pod). Si habilitas bind de red + token (ver README),
          # puedes agregar readiness/liveness httpGet en / :5476.

        # ------------------------------------------------------------------------
        # Sidecar "login-shim": auto-login para crew.home.lab y gestion de cuenta.
        # Mintea un token por loopback (comparte red y PVC con el contenedor principal)
        # y redirige a la interfaz. En /account permite cambiar la cuenta de kiro-cli
        # (Builder ID / SSO Identity Center) por device flow: por eso monta el PVC en
        # RW (escribe la sesion de kiro-cli en el store compartido). Expuesto aparte en
        # crew-login.home.lab (ver login-shim-*.yaml).
        # OJO SEGURIDAD: mintear/cambiar cuenta = saltarse la barrera de token de Crew.
        # Por eso muestra una pagina de login propia (formulario user/contraseña, Secret
        # kirocrew-login-auth). Sin password y sin LOGIN_SHIM_ALLOW_OPEN, queda DESACTIVADO.
        # ------------------------------------------------------------------------
        - name: login-shim
          image: ghcr.io/kirodotdev/kirocrew:stable   # misma imagen: trae python3 y el usuario dueño del secreto
          imagePullPolicy: Always
          command: ["python3", "/scripts/login_shim.py"]
          env:
            - name: CREW_PORT
              value: "5476"
            - name: CREW_PUBLIC_URL
              value: "http://crew.home.lab"
            - name: LOGIN_SHIM_PORT
              value: "8088"
            - name: HOME              # kiro-cli guarda la sesion en $HOME/.local/share/kiro-cli (el PVC)
              value: "/home/kirocrew"
            # form-auth (recomendado). El password viene del Secret kirocrew-login-auth
            # (opcional): si no existe, el shim queda desactivado salvo LOGIN_SHIM_ALLOW_OPEN.
            - name: LOGIN_SHIM_USER
              value: "crew"
            - name: LOGIN_SHIM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kirocrew-login-auth
                  key: password
                  optional: true
            # Descomenta para permitir mint SIN basic-auth (mintea a cualquiera en la LAN):
            # - name: LOGIN_SHIM_ALLOW_OPEN
            #   value: "true"
          ports:
            - name: shim
              containerPort: 8088
          volumeMounts:
            - name: home
              mountPath: /home/kirocrew
              # RW: /account ejecuta `kiro-cli login`, que escribe la sesion en el PVC
              # (el mismo store que usa Crew). Lee .local_secret para mintear el token.
            - name: login-shim
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8088
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: kirocrew-home
        - name: login-shim
          configMap:
            name: kirocrew-login-shim
