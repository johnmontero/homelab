# RBAC mínimo para que Kiro Crew pueda reiniciar deploys del homelab tras CI verde.
# Alcance: namespaces `pivas`, `pulse` y `kuska` (una Role+RoleBinding por ns). Sin
# permisos de cluster. Cotejo NO aplica (despliega en AWS, no en el homelab).
#
# `kubectl rollout restart` = patch de una anotación en spec.template del Deployment.
# `kubectl rollout status`  = lee deployments + replicasets + pods.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kirocrew-deployer
  namespace: kirocrew
  labels:
    app: kirocrew
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pivas-rollout
  namespace: pivas          # los permisos viven en el ns de PIVAS
  labels:
    app: kirocrew
rules:
  # Reiniciar (patch) y consultar el Deployment. `list`/`watch` no aceptan
  # resourceNames; `get`/`patch` sí se podrían acotar a ["pivas"] (ver nota abajo).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  # `rollout status` inspecciona replicasets y pods.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kirocrew-pivas-rollout
  namespace: pivas
  labels:
    app: kirocrew
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pivas-rollout
subjects:
  # El SA vive en el ns kirocrew; un RoleBinding puede referenciar SAs de otro ns.
  - kind: ServiceAccount
    name: kirocrew-deployer
    namespace: kirocrew
---
# Mismo permiso para el ns `pulse` (rollout de Pulse tras CI verde).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pulse-rollout
  namespace: pulse
  labels:
    app: kirocrew
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kirocrew-pulse-rollout
  namespace: pulse
  labels:
    app: kirocrew
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pulse-rollout
subjects:
  - kind: ServiceAccount
    name: kirocrew-deployer
    namespace: kirocrew
---
# Mismo permiso para el ns `kuska` (rollout de Kuska tras CI verde).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kuska-rollout
  namespace: kuska
  labels:
    app: kirocrew
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kirocrew-kuska-rollout
  namespace: kuska
  labels:
    app: kirocrew
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kuska-rollout
subjects:
  - kind: ServiceAccount
    name: kirocrew-deployer
    namespace: kirocrew
---
# Permiso ACOTADO para que el login-shim reinicie SOLO el deployment `kirocrew`
# (boton "Reiniciar Crew ahora" tras cambiar de cuenta). `rollout restart` = patch de
# la anotacion restartedAt en spec.template. resourceNames lo limita a ese deployment.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kirocrew-self-rollout
  namespace: kirocrew
  labels:
    app: kirocrew
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["kirocrew"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kirocrew-self-rollout
  namespace: kirocrew
  labels:
    app: kirocrew
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kirocrew-self-rollout
subjects:
  - kind: ServiceAccount
    name: kirocrew-deployer
    namespace: kirocrew
