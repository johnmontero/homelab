# Password de basic-auth para el login-shim. NO se versiona el real (ver .gitignore);
# copia este ejemplo, pon tu password y aplícalo:
#   cp login-shim-secret.example.yaml login-shim-secret.yaml
#   # edita el valor y luego:
#   kubectl apply -f login-shim-secret.yaml
#
# Alternativa imperativa (sin archivo):
#   kubectl -n kirocrew create secret generic kirocrew-login-auth \
#     --from-literal=password='TU_PASSWORD_FUERTE'
#
# Usuario por defecto: "crew" (LOGIN_SHIM_USER en el deployment). En el navegador
# se pide una vez y queda cacheado.
apiVersion: v1
kind: Secret
metadata:
  name: kirocrew-login-auth
  namespace: kirocrew
  labels:
    app: kirocrew
type: Opaque
stringData:
  password: "CAMBIA_ESTE_PASSWORD"
