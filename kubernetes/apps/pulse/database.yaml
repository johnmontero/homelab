# Base de datos dedicada de Pulse dentro del cluster CNPG de dev (postgres-dev).
# Se crea de forma declarativa vía el CRD Database de CloudNativePG, propiedad del
# rol existente `dev_admin` (no crea rol nuevo). Pulse se conecta a esta base con
# las credenciales de `dev_admin` (mismas del secret postgres-dev-app), pero con
# DB_NAME=pulse — aislada de `dev_db` y de `pivas`.
#
# Alternativa manual (si se prefiere no usar el CRD):
#   kubectl -n data exec -it postgres-dev-1 -- psql -U postgres \
#     -c "CREATE DATABASE pulse OWNER dev_admin;"
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pulse
  namespace: data
spec:
  cluster:
    name: postgres-dev
  name: pulse
  owner: dev_admin
