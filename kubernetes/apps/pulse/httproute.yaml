# Ruta interna (LAN) por Envoy Gateway para health-check rápido en `home.lab`.
# El acceso externo (si aplica) va por Cloudflare Tunnel. En :prod, Phoenix valida
# el origen del WebSocket contra PHX_HOST; por eso pulse.home.lab sirve para GET /
# (salud), pero el LiveView/WSS se prueba por el dominio público.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pulse
  namespace: pulse
spec:
  hostnames:
    - pulse.home.lab
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab-gateway
      namespace: default
      sectionName: http
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: pulse-service
          port: 4002
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        backendRequest: 60s
        request: 60s
