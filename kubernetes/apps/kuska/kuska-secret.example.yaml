# Variables de entorno de Kuska (plantilla). NO commitear el secret real.
# Crear con kubectl (recomendado) y NO versionar los valores reales:
#
#   # Password de dev_admin (rol dueño de la base 'kuska'), tomada del secret CNPG:
#   DBPASS=$(kubectl -n data get secret postgres-dev-app \
#     -o jsonpath='{.data.password}' | base64 -d)
#
#   kubectl create secret generic kuska-env -n kuska \
#     --from-literal=PHX_SERVER=true \
#     --from-literal=PHX_HOST=kuska.nx73.app \
#     --from-literal=PORT=4003 \
#     --from-literal=SECRET_KEY_BASE="$(openssl rand -base64 48)" \
#     --from-literal=DB_HOST=postgres-dev-rw.data.svc.cluster.local \
#     --from-literal=DB_PORT=5432 \
#     --from-literal=DB_USER=dev_admin \
#     --from-literal=DB_PASSWORD="$DBPASS" \
#     --from-literal=DB_NAME=kuska
#
# LLM (Amazon Bedrock) es OPCIONAL: runtime.exs usa System.get_env (no falla si
# faltan). Para habilitar agentes con Bedrock, añadir al secret:
#     --from-literal=BEDROCK_REGION=us-east-1 \
#     --from-literal=BEDROCK_ACCESS_KEY_ID=<...> \
#     --from-literal=BEDROCK_SECRET_ACCESS_KEY=<...>
#
# Esta plantilla queda solo como referencia de las claves esperadas:
apiVersion: v1
kind: Secret
metadata:
  name: kuska-env
  namespace: kuska
type: Opaque
stringData:
  PHX_SERVER: "true"
  PHX_HOST: "kuska.nx73.app"
  PORT: "4003"
  SECRET_KEY_BASE: "REEMPLAZAR"           # openssl rand -base64 48
  DB_HOST: "postgres-dev-rw.data.svc.cluster.local"
  DB_PORT: "5432"
  DB_USER: "dev_admin"
  DB_PASSWORD: "REEMPLAZAR"                # secret CNPG postgres-dev-app -> password
  DB_NAME: "kuska"
  # ── LLM Bedrock (opcional; descomentar para habilitar agentes) ──
  # BEDROCK_REGION: "us-east-1"
  # BEDROCK_ACCESS_KEY_ID: "REEMPLAZAR"
  # BEDROCK_SECRET_ACCESS_KEY: "REEMPLAZAR"
