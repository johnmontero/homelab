# Variables de entorno de PIVAS (plantilla). NO commitear el secret real.
# Crear con kubectl (recomendado) y NO versionar los valores reales:
#
#   # Password de dev_admin (rol dueño de la base 'pivas'), tomada del secret CNPG:
#   DB_PASS=$(kubectl -n data get secret postgres-dev-app \
#     -o jsonpath='{.data.password}' | base64 -d)
#
#   kubectl create secret generic pivas-env -n pivas \
#     --from-literal=PHX_SERVER=true \
#     --from-literal=PHX_HOST=pivas.nx73.app \
#     --from-literal=PORT=4003 \
#     --from-literal=SECRET_KEY_BASE="$(openssl rand -base64 48)" \
#     --from-literal=DB_HOST=postgres-dev-rw.data.svc.cluster.local \
#     --from-literal=DB_PORT=5432 \
#     --from-literal=DB_USER=dev_admin \
#     --from-literal=DB_PASSWORD="$DB_PASS" \
#     --from-literal=DB_NAME=pivas \
#     --from-literal=S3_ENDPOINT=http://rustfs-service.storage.svc.cluster.local:9000 \
#     --from-literal=S3_PUBLIC_ENDPOINT=https://pivas-evidence.nx73.app \
#     --from-literal=S3_REGION=us-east-1 \
#     --from-literal=S3_ACCESS_KEY_ID=<RUSTFS_ACCESS_KEY> \
#     --from-literal=S3_SECRET_ACCESS_KEY=<RUSTFS_SECRET_KEY> \
#     --from-literal=S3_EVIDENCE_BUCKET=cdat-pivas-evidence-storage \
#     --from-literal=LIVEKIT_URL=wss://<proyecto>.livekit.cloud \
#     --from-literal=LIVEKIT_API_KEY=<LK_API_KEY> \
#     --from-literal=LIVEKIT_API_SECRET=<LK_API_SECRET>
#
# Esta plantilla queda solo como referencia de las claves esperadas:
apiVersion: v1
kind: Secret
metadata:
  name: pivas-env
  namespace: pivas
type: Opaque
stringData:
  PHX_SERVER: "true"
  PHX_HOST: "pivas.nx73.app"
  PORT: "4003"
  SECRET_KEY_BASE: "REEMPLAZAR"           # openssl rand -base64 48
  DB_HOST: "postgres-dev-rw.data.svc.cluster.local"
  DB_PORT: "5432"
  DB_USER: "dev_admin"
  DB_PASSWORD: "REEMPLAZAR"                # secret CNPG postgres-dev-app -> password
  DB_NAME: "pivas"
  S3_ENDPOINT: "http://rustfs-service.storage.svc.cluster.local:9000"
  S3_PUBLIC_ENDPOINT: "https://pivas-evidence.nx73.app"
  S3_REGION: "us-east-1"
  S3_ACCESS_KEY_ID: "REEMPLAZAR"           # secret rustfs-creds -> access-key
  S3_SECRET_ACCESS_KEY: "REEMPLAZAR"       # secret rustfs-creds -> secret-key
  S3_EVIDENCE_BUCKET: "cdat-pivas-evidence-storage"
  LIVEKIT_URL: "wss://REEMPLAZAR.livekit.cloud"
  LIVEKIT_API_KEY: "REEMPLAZAR"
  LIVEKIT_API_SECRET: "REEMPLAZAR"
  # ── Grabación por egress (HU-0003.0008) ──
  # Para grabar, el destino S3 debe ser accesible desde LiveKit Cloud (S3 real, no
  # el RustFS interno). Unificar storage a S3: quitar S3_ENDPOINT y apuntar S3_* al
  # bucket S3. Activar con EGRESS_ENABLED=true. Reutiliza S3_* (o define EGRESS_S3_*).
  # EGRESS_ENABLED: "true"
  # ── Utilidad de pruebas (SOLO homelab): reiniciar un caso borrando su evidencia ──
  # ALLOW_CLAIM_RESET: "true"
