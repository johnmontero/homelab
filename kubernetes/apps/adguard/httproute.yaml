# Expone la UI de AdGuard en adguard.home.lab (sin puerto) por el Envoy Gateway
# (homelab-gateway, IP MetalLB 192.168.18.220). Requiere el DNS rewrite en AdGuard:
#   adguard.home.lab → 192.168.18.220
# El backend real es el host ZimaBoard 10.0.1.1:3001 (ver backend.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard-route
  namespace: adguard
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: default
      sectionName: http
  hostnames:
    - adguard.home.lab
  rules:
    - backendRefs:
        - name: adguard
          port: 3001
