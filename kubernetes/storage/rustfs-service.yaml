apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.universe.tf/ip-allocated-from-pool: homelab-pool
  name: rustfs-service
  namespace: storage
spec:
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  loadBalancerIP: 192.168.18.225
  ports:
  - name: s3-api
    nodePort: 31146
    port: 9000
    protocol: TCP
    targetPort: 9000
  - name: console
    nodePort: 31479
    port: 9001
    protocol: TCP
    targetPort: 9001
  selector:
    app: rustfs
  type: LoadBalancer
