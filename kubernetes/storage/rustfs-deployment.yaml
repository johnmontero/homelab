apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rustfs
  name: rustfs
  namespace: storage
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: rustfs
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
      - env:
        - name: RUSTFS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: access-key
              name: rustfs-creds
        - name: RUSTFS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: secret-key
              name: rustfs-creds
        - name: RUSTFS_DATA_DIR
          value: /data
        - name: RUSTFS_LOG_DIR
          value: /logs
        image: docker.io/rustfs/rustfs:latest
        imagePullPolicy: IfNotPresent
        name: rustfs
        ports:
        - containerPort: 9000
          name: s3-api
          protocol: TCP
        - containerPort: 9001
          name: console
          protocol: TCP
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          runAsGroup: 10001
          runAsUser: 10001
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: storage
        - mountPath: /logs
          name: logs
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - sh
        - -c
        - chown -R 10001:10001 /data /logs && chmod -R 770 /data /logs
        image: docker.io/library/busybox:latest
        imagePullPolicy: Always
        name: init-permissions
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: storage
        - mountPath: /logs
          name: logs
      nodeSelector:
        kubernetes.io/hostname: zimaboard2
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
      terminationGracePeriodSeconds: 30
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: rustfs-data-pvc
      - emptyDir: {}
        name: logs
