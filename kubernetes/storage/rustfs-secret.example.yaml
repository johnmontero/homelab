# Credenciales de RustFS. NO commitear el secret real (usar esta plantilla).
# El deployment de RustFS lee las claves `access-key` y `secret-key`.
#   kubectl create secret generic rustfs-creds -n storage \
#     --from-literal=access-key='<ACCESS_KEY>' \
#     --from-literal=secret-key='<SECRET_KEY>'
apiVersion: v1
kind: Secret
metadata:
  name: rustfs-creds
  namespace: storage
type: Opaque
stringData:
  access-key: "REEMPLAZAR"
  secret-key: "REEMPLAZAR"
