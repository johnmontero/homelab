# Secret opcional de Ollama (clave `api-key`). El deployment lo referencia como
# opcional; crear solo si se quiere proteger el endpoint.
#   kubectl create secret generic ollama-secrets -n ai-agents \
#     --from-literal=api-key='<API_KEY>'
apiVersion: v1
kind: Secret
metadata:
  name: ollama-secrets
  namespace: ai-agents
type: Opaque
stringData:
  api-key: "REEMPLAZAR"
