apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: localai-route
  namespace: ai-agents
spec:
  hostnames:
  - ai.home.lab
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: homelab-gateway
    namespace: default
    sectionName: http
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: ollama-service
      port: 11434
      weight: 1
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /ollama
    timeouts:
      backendRequest: 300s
      request: 300s
  - backendRefs:
    - group: ''
      kind: Service
      name: kokoro-tts-service
      port: 8880
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /v1/audio
    timeouts:
      backendRequest: 60s
      request: 60s
  - backendRefs:
    - group: ''
      kind: Service
      name: localai-service
      port: 8080
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      backendRequest: 300s
      request: 300s
